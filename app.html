<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بيستاهل">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<title>بيستاهل</title>
<meta name="theme-color" content="#FFF3DF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
/* تخطيط: تطبيق جوال بعرض أقصى 430px، توجيه RTL، هوية بيستاهل (برتقالي وذهبي وعاجي وبني). نمط واحد ثابت بقرار التصميم. */
:root{--ivory:#FFF3DF;--ink:#392719;--orange:#F4770B;--orange-strong:#BF5500;--orange-text:#B45000;--gold:#D6AD55;--gold-strong:#B8892E;--err:#C8372D;--line:#EBDDC6;--sk:#DCD0BF;--sk2:#EADFCC;--muted:rgba(57,39,25,.68);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ivory)}
body{font-family:'Almarai','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;color:var(--ink);direction:rtl;font-size:14px;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
.screen{width:100%;max-width:430px;margin:0 auto;min-height:100dvh;background:var(--ivory);position:relative;display:flex;flex-direction:column;overflow-x:clip}
@media(min-width:460px){.screen{box-shadow:0 0 40px rgba(57,39,25,.12)}}
.grow{flex:1}
.sk{display:inline-block;background:var(--sk)}.sk2{display:inline-block;background:var(--sk2)}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.ib{border:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(57,39,25,.10);flex:none;background:#fff;color:var(--ink);width:40px;height:40px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(57,39,25,.07)}
.h2{font-size:16px;font-weight:700;line-height:24px}
.muted{color:var(--muted)}.small{font-size:12px}
.link{font-size:12px;font-weight:600;color:var(--orange-text);display:inline-flex;align-items:center;gap:2px;background:none;border:0;cursor:pointer}
.stars{display:inline-flex;align-items:center}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid rgba(57,39,25,.14);display:flex;align-items:center;flex:none;font-size:13px;font-weight:600;gap:6px}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 2px 6px rgba(244,119,11,.25)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.pc{width:156px;flex:none;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(57,39,25,.07);overflow:hidden;border:0;text-align:right;display:block}
.pc .img{height:100px;background:#EFE3CE;display:flex;align-items:center;justify-content:center;color:var(--gold-strong)}
.pc .b{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.hc{display:flex;gap:12px;padding:10px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(57,39,25,.07);align-items:stretch;border:0;text-align:right;width:100%}
.hc .img{width:84px;height:84px;border-radius:10px;background:#EFE3CE;flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold-strong)}
.hc .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:2px 0}
.nm{font-size:14px;font-weight:700;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.nav{position:sticky;bottom:0;height:calc(68px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid rgba(57,39,25,.08);box-shadow:0 -4px 12px rgba(57,39,25,.05);display:flex;align-items:center;justify-content:space-around;padding-left:8px;padding-right:8px;z-index:9;flex:none;margin-top:auto}
.nav button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:none;border:0}
.nav button.on{color:var(--orange-strong)}
.nav .fab{width:56px;height:56px;border-radius:50%;background:var(--orange);border:4px solid #fff;color:#fff;margin-top:-26px;box-shadow:0 6px 16px rgba(244,119,11,.4)}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;font-weight:600}
.inp{height:46px;width:100%;border-radius:12px;border:1px solid var(--line);background:#FFFCF6;padding:0 14px;outline-offset:0}
.inp:focus{border:1.5px solid var(--orange);outline:none}
textarea.inp{height:110px;padding:12px 14px;resize:none;line-height:22px}
select.inp{appearance:none;background-image:none}
.btn{height:50px;border:0;border-radius:999px;background:var(--orange-strong);color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 16px rgba(191,85,0,.28);width:100%}
.btn:disabled{background:#FDEBD9;color:#A9743F;box-shadow:none;cursor:not-allowed}
.btn.out{background:#fff;color:var(--orange-text);border:1.5px solid var(--orange-text);box-shadow:none;height:46px;font-size:14px}
.btn.red{background:var(--err);box-shadow:none}
.deco1{position:absolute;top:-96px;right:-96px;width:288px;height:288px;border-radius:50%;background:var(--gold);opacity:.08;pointer-events:none}
.deco2{position:absolute;bottom:-110px;left:-110px;width:320px;height:320px;border-radius:50%;background:var(--gold);opacity:.08;pointer-events:none}
.tabs{display:flex;background:#fff;margin:0 16px;border-radius:12px;box-shadow:0 2px 10px rgba(57,39,25,.07)}
.tab{flex:1;text-align:center;padding:12px 0 10px;font-size:14px;font-weight:600;color:var(--muted);border:0;border-bottom:3px solid transparent;background:none}
.tab.on{color:var(--orange-text);border-bottom-color:var(--orange-text)}
.bbar{position:sticky;bottom:0;background:rgba(255,255,255,.96);box-shadow:0 -4px 20px rgba(57,39,25,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:9;flex:none;margin-top:auto}
.bbar .btn{flex:1;height:48px}
.hero{position:relative;height:190px;background:#EFE3CE;flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold-strong)}
.hero .t{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between}
.info{margin:-12px 16px 0;padding:16px;position:relative;z-index:2;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;background:#FFF8EC;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--sk2);position:relative;flex:1;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;right:0;background:var(--orange);border-radius:99px}
.rv{padding:14px;display:flex;flex-direction:column;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sk2);color:var(--gold-strong);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 32px 0}
.empty .circle{width:96px;height:96px;border-radius:50%;background:#FDEBD9;display:flex;align-items:center;justify-content:center;color:var(--orange-strong)}
.empty b{font-size:18px;margin-top:6px}.empty p{font-size:14px;line-height:22px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(57,39,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:0 32px}
.sheet{width:100%;max-width:430px;background:var(--ivory);border-radius:24px 24px 0 0;padding:10px 0 calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 -8px 30px rgba(57,39,25,.2);max-height:90dvh;overflow-y:auto}
.handle{width:44px;height:5px;border-radius:99px;background:#D9CBB4;align-self:center}
.dlg{background:#fff;border-radius:20px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(57,39,25,.3)}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-radius:12px;border:0;box-shadow:0 2px 10px rgba(57,39,25,.07);width:100%;text-align:right}
.ico{width:40px;height:40px;border-radius:10px;background:#FDEBD9;color:var(--orange-strong);display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:fixed;left:16px;right:16px;bottom:96px;margin:auto;max-width:360px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;z-index:60}
.star-btn{border:0;background:none;padding:2px;display:inline-flex}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;box-shadow:0 2px 10px rgba(57,39,25,.07);gap:4px}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--orange-strong);color:#fff}
.tl{position:relative;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.tl:before{content:"";position:absolute;right:35px;top:20px;bottom:20px;width:2px;background:#E6D7BD}
.tli{display:flex;gap:12px;align-items:flex-start;position:relative}
.dot{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #F9C79A;display:flex;align-items:center;justify-content:center;color:var(--orange-strong);flex:none;z-index:2}
.banner{margin:0 16px;padding:12px 14px;border-radius:12px;background:#FBE5E2;color:#8F211A;font-size:13px;font-weight:600;line-height:20px}
.shm .sk,.shm .sk2,.shm .img{background-image:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.38) 50%,rgba(255,255,255,0));background-size:220% 100%;background-repeat:no-repeat;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
@media(prefers-reduced-motion:reduce){.shm .sk,.shm .sk2,.shm .img{animation:none}}
.img img,.hero>img{width:100%;height:100%;object-fit:cover;display:block}
.hero>img{position:absolute;inset:0}
.hero.has:after{content:"";position:absolute;inset:0 0 auto;height:96px;background:linear-gradient(rgba(57,39,25,.42),transparent);pointer-events:none}
.hero .t{z-index:2}
.pic{width:100%;border-radius:12px;display:block;max-height:240px;object-fit:cover;background:var(--sk2)}
.pickbox{height:120px;border:1.5px dashed var(--gold-strong);border-radius:12px;background:#FFFCF6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--orange-text);font-weight:600;width:100%}
.pickprev{position:relative;border-radius:12px;overflow:hidden;height:180px;background:var(--sk2)}
.pickprev img{width:100%;height:100%;object-fit:cover;display:block}
.pickprev .ib{position:absolute;top:8px;width:36px;height:36px;background:rgba(255,255,255,.95)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:90dvh;border-radius:10px}
.leaflet-container{z-index:0;font-family:inherit}
.dotsr{display:flex;justify-content:center;gap:6px}.dotsr i{width:8px;height:8px;border-radius:50%;background:#E6D7BD}.dotsr i.on{width:24px;border-radius:99px;background:var(--orange)}

/* ===== صقل بصري v2.5 ===== */
:root{--r:16px;--sh1:0 1px 2px rgba(57,39,25,.05),0 6px 18px rgba(57,39,25,.07);--sh2:0 2px 6px rgba(57,39,25,.06),0 16px 36px rgba(57,39,25,.13)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-feature-settings:"tnum" 1,"kern" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.55}
::selection{background:rgba(244,119,11,.25)}
.screen.anim{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h2{font-size:17px;line-height:26px;font-weight:700}
.sech{display:flex;align-items:center;gap:9px}.sech:before{content:"";width:4px;height:20px;border-radius:4px;background:linear-gradient(var(--orange),var(--gold))}
.nm{font-size:15px;line-height:22px}
.small{line-height:18px}
.card{border-radius:var(--r);box-shadow:var(--sh1)}
.pc,.hc,.opt,button.card{transition:transform .16s ease,box-shadow .16s ease}
.pc:active,.hc:active,.opt:active,button.card:active{transform:scale(.98)}
.pc{width:172px;border-radius:var(--r);box-shadow:var(--sh1)}
.hc{border-radius:var(--r);box-shadow:var(--sh1);padding:12px}
.pc .img,.hc .img,.hero{background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.55),transparent 45%),linear-gradient(135deg,#F8E6C8,#EBCB93)}
.pc .img{height:116px;position:relative}.hc .img{border-radius:12px;width:92px;height:92px;position:relative}
.img svg{opacity:.8}
.badge{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.96);border-radius:999px;padding:3px 9px 3px 7px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(57,39,25,.18);z-index:2}
.nav{height:calc(72px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.93);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.nav button{flex-direction:column;gap:3px;width:68px;height:60px;font-size:11px;font-weight:600;position:relative;border-radius:12px;transition:color .15s}
.nav button.on{font-weight:700}
.nav button.on:before{content:"";position:absolute;top:-6px;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--orange-strong)}
.nav .fab{width:58px;height:58px;margin-top:-30px;border-radius:50%;box-shadow:0 10px 24px rgba(244,119,11,.45);transition:transform .15s}.nav .fab:active{transform:scale(.94)}
.btn{box-shadow:0 8px 20px rgba(191,85,0,.28),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s ease,box-shadow .12s}
.btn:active:not(:disabled){transform:scale(.985)}
.btn.out{box-shadow:none}
.chip{transition:background .15s,color .15s,border-color .15s;box-shadow:0 1px 2px rgba(57,39,25,.04)}
.star-btn svg{transition:transform .14s cubic-bezier(.3,1.6,.5,1)}.star-btn:active svg{transform:scale(1.3)}
.tb{position:sticky;top:0;z-index:20;background:rgba(255,243,223,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero{height:236px}
.hero.has:after{height:110px}
.info{border-radius:20px;box-shadow:var(--sh2);margin-top:-28px}
.bar{height:9px}.bar i{background:linear-gradient(to left,var(--orange),var(--gold))}
.avatar{background:linear-gradient(135deg,#FBE9C8,#F2D59C);color:#6B4C0E}
.tabs{border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden}
.tab{transition:color .15s}
.empty .circle{box-shadow:0 0 0 10px rgba(244,119,11,.07),0 0 0 22px rgba(244,119,11,.04)}
.ov{animation:fade .2s ease}.sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}.dlg{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.toast{animation:vin .24s ease;box-shadow:0 10px 30px rgba(57,39,25,.3)}
.splash-logo{animation:pop .7s cubic-bezier(.2,.9,.3,1.15) both}
.searchbar{height:50px;border-radius:999px;background:#fff;border:0;box-shadow:var(--sh1);padding:0 18px;gap:10px;color:var(--muted);width:100%;transition:box-shadow .15s}
.searchbar:active{box-shadow:var(--sh2)}
.catb .c{transition:transform .15s,box-shadow .15s}.catb:active .c{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ===== إعادة تصميم v3 (2026) ===== */
:root{--r:24px;--sh1:0 1px 0 rgba(57,39,25,.03),0 8px 28px rgba(57,39,25,.07);--sh2:0 2px 6px rgba(57,39,25,.05),0 18px 44px rgba(57,39,25,.14)}
body{font-size:15px;line-height:1.6}
.h2{font-size:20px;line-height:30px;font-weight:800}
.sech:before{width:0;height:0;display:none}
.nm{font-size:16px;line-height:24px;font-weight:800}
.small{font-size:13px;line-height:20px}.link{font-size:13px;font-weight:700;background:rgba(191,85,0,.09);padding:6px 12px;border-radius:999px;gap:4px}
.card{border-radius:var(--r)}
.ib{width:44px;height:44px;box-shadow:0 4px 14px rgba(57,39,25,.10)}
.hero .ib,.pickprev .ib{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* بطاقة المكان: صورة أولاً */
.pc{width:196px;background:none;box-shadow:none;border-radius:0;overflow:visible}
.pc .img{height:228px;border-radius:26px;overflow:hidden;box-shadow:var(--sh1)}
.pc .b{padding:12px 4px 0;gap:4px}
.pc:active{transform:scale(.97)}
.badge{top:12px;right:12px;padding:5px 11px 5px 9px;font-size:13px;font-weight:800;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hc{border-radius:var(--r);padding:12px;gap:14px}
.hc .img{width:96px;height:96px;border-radius:18px}
/* الفئات */
.cat{height:50px;padding:0 20px;border-radius:18px;background:#fff;box-shadow:var(--sh1);display:flex;align-items:center;gap:10px;flex:none;border:0;font-weight:800;font-size:14px;color:var(--ink);transition:transform .15s}
.cat svg{color:var(--orange-strong)}.cat:active{transform:scale(.96)}
.hl{font-size:30px;line-height:42px;font-weight:800;letter-spacing:0;padding:6px 16px 0;text-wrap:balance}
.hl em{font-style:normal;color:var(--orange-strong)}
.searchbar{height:56px;border-radius:20px;padding:0 18px;font-size:15px}
/* شريط التنقل العائم */
.nav{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:auto 16px calc(12px + env(safe-area-inset-bottom,0px));height:68px;padding:0 6px;border-radius:28px;border:0;background:rgba(255,255,255,.88);box-shadow:0 12px 40px rgba(57,39,25,.18),0 0 0 1px rgba(57,39,25,.04)}
.nav button{width:62px;height:54px;border-radius:20px;gap:2px;font-size:11px}
.nav button.on{background:rgba(244,119,11,.13)}.nav button.on:before{display:none}
.nav .fab{width:56px;height:56px;margin:0;border:0;border-radius:20px;background:var(--orange-strong);box-shadow:0 10px 24px rgba(191,85,0,.4)}
/* الأزرار والحقول */
.btn{height:54px;border-radius:20px;font-size:16px;font-weight:800}
.btn.out{height:50px;border-radius:18px;font-size:15px;border:1.5px solid rgba(191,85,0,.35);color:var(--orange-text)}
.inp{height:54px;border-radius:16px;background:#fff;border:1.5px solid transparent;box-shadow:var(--sh1);padding:0 16px;font-size:15px}
.inp:focus{border-color:var(--orange)}
textarea.inp{height:120px;padding:14px 16px}
.lbl{font-size:14px;font-weight:800}
.bbar{background:linear-gradient(to top,var(--ivory) 58%,rgba(255,243,223,0));box-shadow:none;padding:28px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bbar .btn{height:56px}
/* تبويبات مقسّمة */
.tabs{padding:5px;gap:4px;border-radius:20px}
.tab{border:0;border-radius:16px;padding:11px 0;font-size:14px;font-weight:800}
.tab.on{background:var(--orange-strong);color:#fff}
.seg{border-radius:18px;padding:5px}.seg button{border-radius:14px;height:42px;font-weight:800}
/* صفحة المكان */
.hero{height:300px;border-radius:0 0 36px 36px;overflow:hidden}

  if(S.mapView)m.setView(S.mapView.c,S.mapView.z);else if(pts.length)m.fitBounds(pts,{padding:[50,50],maxZoom:16});else if(S.pos)m.setView([S.pos.lat,S.pos.lng],14);else m.setView([33.51,36.29],6);
  m.on('moveend',function(){var c=m.getCenter();S.mapView={c:[c.lat,c.lng],z:m.getZoom()};});}
 var mini=document.getElementById('minimap');
 if(mini){var q=placeById(mini.dataset.id);if(q&&hasLoc(q)){var m2=L.map(mini,{zoomControl:false,dragging:false,scrollWheelZoom:false,touchZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,attributionControl:false}).setView([q.lat,q.lng],15);S.maps.push(m2);tiles(m2);L.marker([q.lat,q.lng],{icon:pinIcon(true),interactive:false}).addTo(m2);}}
 var pick=document.getElementById('pickmap');
 if(pick){var P=S.pdraft||{},m3=L.map(pick,{zoomControl:false}),mk=null;S.maps.push(m3);tiles(m3);
  var put=function(la,ln){if(mk)mk.setLatLng([la,ln]);else mk=L.marker([la,ln],{icon:pinIcon(true)}).addTo(m3);S.pick={lat:la,lng:ln};var b=document.getElementById('pickok');if(b)b.disabled=false;};
  var pk=S.pick||(hasLoc(P)?P:null);
  if(pk){m3.setView([pk.lat,pk.lng],16);put(pk.lat,pk.lng);}else if(S.pos)m3.setView([S.pos.lat,S.pos.lng],16);else m3.setView([33.51,36.29],6);
  if(S.pos)L.marker([S.pos.lat,S.pos.lng],{icon:meIcon(),interactive:false}).addTo(m3);
  m3.on('click',function(e){put(e.latlng.lat,e.latlng.lng);});}}
function go(h){if(location.hash==='#'+h){render(true);return;}location.hash=h;}
window.addEventListener('hashchange',function(){S.anim=true;S.navCount++;S.sheet=null;S.dlg=null;if(route().name!=='add')S.draft=null;if(route().name!=='addplace'&&route().name!=='pickloc')S.pdraft=null;if(route().name!=='pickloc')S.pick=null;if(route().name!=='editprofile')S.edraft=null;S._force=true;window.scrollTo(0,0);render(true);});

/* ---------- الأفعال ---------- */
var ACT={
 back:function(){if(S.navCount>0)history.back();else go('home');},
 fab:function(){S.sheet='fab';render(true);},
 closesheet:function(){S.sheet=null;render(true);},
 closedlg:function(){S.dlg=null;render(true);},
 onbnext:function(){if((S.onb||0)<ONB.length-1){S.onb=(S.onb||0)+1;render(true);}else{LS.set('onb_seen',1);go('home');}},
 onbskip:function(){LS.set('onb_seen',1);go('home');},
 reonb:function(){S.onb=0;go('onb');},
 cat:function(el){S.F.cat=el.dataset.id||'';S.showAll=true;if(route().name!=='search'){go('search');}else{S._force=true;render(true);}},
 seeall:function(el){S.F={cat:'',sort:el.dataset.sort||'rating',min:0};S.q='';S.showAll=true;go('search');},
 sheetfilter:function(){S.sheet='filter';render(true);},
 fcat:function(el){S.F.cat=el.dataset.id||'';render(true);},fsort:function(el){S.F.sort=el.dataset.id;render(true);},
 fmin:function(el){var v=+el.dataset.v;S.F.min=(S.F.min===v?0:v);render(true);},
 resetf:function(){S.F={cat:'',sort:'rating',min:0};S.q='';S.showAll=false;S.sheet=null;S._force=true;render(true);},
 recent:function(el){S.q=el.dataset.q;S.showAll=true;S._force=true;render(true);},
 clearrecent:function(){LS.set('recent',[]);render(true);},
 share:function(){var u=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast('تم نسخ الرابط');},function(){toast(u);});}else toast(u);},
 save:function(el){if(!S.db||!S.uid){toast('الحفظ غير متاح حالياً');return;}var type=el.dataset.type,id=el.dataset.id,key=type+'_'+id,ref=S.db.collection('data/users/'+S.uid).doc(key);
  var done=isSaved(type,id)?ref.delete():ref.set({type:type,id:id,ts:Date.now()});done.catch(function(){toast('تعذّر الحفظ');});},
 kind:function(el){S.draft.kind=el.dataset.v;S._force=true;render(true);},
 star:function(el){S.draft.s[el.dataset.k]=+el.dataset.v;S._force=true;render(true);},
 pcat:function(el){S.pdraft.cat=el.dataset.id;S._force=true;render(true);},
 publish:function(el){var D=S.draft;if(!D||!S.db||!S.uid)return;el.disabled=true;var isDish=D.kind==='dish',now=Date.now(),chain=Promise.resolve(),dishId=D.dishId;
  if(isDish&&dishId==='__new'){dishId='d'+uid();var nd={placeId:D.placeId,name:D.newDish.trim(),photo:D.photo||'',by:S.uid,ts:now};chain=S.db.collection('dishes').doc(dishId).set(nd);}
  chain.then(function(){var target=isDish?dishId:D.placeId;var rev={photo:D.photo||'',kind:isDish?'dish':'place',placeId:D.placeId,dishId:isDish?dishId:'',by:S.uid,s:isDish?{taste:D.s.taste,price:D.s.price}:{service:D.s.service,clean:D.s.clean},text:D.text.trim(),ts:now};
   return S.db.collection('reviews').doc(S.uid+'_'+target).set(rev);}).then(function(){S.draft=null;go('done');}).catch(function(){el.disabled=false;toast('تعذّر نشر التقييم. تحقق من صلاحياتك');});},
 saveplace:function(el){var P=S.pdraft;if(!P||!S.db||!S.uid)return;el.disabled=true;var id='p'+uid();S.db.collection('places').doc(id).set({photo:P.photo||'',lat:typeof P.lat==='number'?P.lat:null,lng:typeof P.lng==='number'?P.lng:null,name:P.name.trim(),cat:P.cat,address:P.address.trim(),hours:P.hours.trim(),by:S.uid,ts:Date.now()}).then(function(){S.pdraft=null;go('place-'+id);}).catch(function(){el.disabled=false;toast('تعذّرت إضافة المكان. تحقق من صلاحياتك');});},
 savebio:function(el){if(!S.db||!S.uid)return;el.disabled=true;S.db.collection('profiles').doc(S.uid).set({bio:(S.edraft?S.edraft.bio:'').trim()}).then(function(){S.edraft=null;toast('تم حفظ الملف');go('me');}).catch(function(){el.disabled=false;toast('تعذّر الحفظ');});},
 locate:function(){var rn=route().name;S.afterLoc=function(){if(rn==='pickloc'){S.pick={lat:S.pos.lat,lng:S.pos.lng};}else S.mapView={c:[S.pos.lat,S.pos.lng],z:15};render(true);};locate(false);},
 gpsloc:function(){S.afterLoc=function(){if(S.pdraft){S.pdraft.lat=S.pos.lat;S.pdraft.lng=S.pos.lng;}S._force=true;render(true);toast('تم تحديد موقعك الحالي');};locate(false);},
 rmloc:function(){if(S.pdraft){delete S.pdraft.lat;delete S.pdraft.lng;}S._force=true;render(true);},
 pickok:function(){if(S.pick&&S.pdraft){S.pdraft.lat=S.pick.lat;S.pdraft.lng=S.pick.lng;}S.pick=null;if(S.navCount>0)history.back();else go('addplace');},
 pickphoto:function(el){S.photoT=el.dataset.t;S.sheet='photo';render(true);},
 rmphoto:function(el){var o=el.dataset.t==='place'?S.pdraft:S.draft;if(o)o.photo='';S._force=true;render(true);},
 zoom:function(el){var r=S.reviews.find(function(x){return x.id===el.dataset.id;});if(r&&r.photo){S.zoom=r.photo;render(true);}},
 unzoom:function(){S.zoom=null;render(true);},
 delreview:function(el){S.dlg={id:el.dataset.id};render(true);},
 confirmdel:function(){var id=S.dlg&&S.dlg.id;S.dlg=null;render(true);if(!id)return;S.db.collection('reviews').doc(id).delete().then(function(){toast('تم حذف التقييم');}).catch(function(){toast('تعذّر الحذف');});}
};
document.addEventListener('click',function(e){
 var t=e.target;if(!t.closest)return;
 var inSheet=t.closest('[data-stop]'),ov=t.closest('.ov');
 var el=t.closest('[data-act],[data-go]');
 if(inSheet&&el===ov)return;
 if(ov&&!inSheet&&el===ov&&el.dataset.act){ACT[el.dataset.act]&&ACT[el.dataset.act](el);return;}
 if(!el)return;e.preventDefault();
 if(el.dataset.act&&ACT[el.dataset.act]){ACT[el.dataset.act](el);return;}
 if(el.dataset.go){var h=el.dataset.go;S.sheet=null;if(h==='add'){S.draft=null;}go(h);}
});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='q'){S.q=t.value;S.showAll=false;var r=document.getElementById('res');if(r)r.innerHTML=resultsHtml();return;}
 if(t.dataset.in&&S.draft){S.draft[t.dataset.in]=t.value;var b=document.querySelector('[data-act=publish]');if(b){var D=S.draft,isD=D.kind==='dish';b.disabled=!(D.placeId&&(isD?((D.dishId&&D.dishId!=='__new')||(D.dishId==='__new'&&D.newDish.trim()))&&D.s.taste>0&&D.s.price>0:(D.s.service>0&&D.s.clean>0)))||S.canWrite===false;}}
 if(t.dataset.pin&&S.pdraft){S.pdraft[t.dataset.pin]=t.value;var b2=document.querySelector('[data-act=saveplace]');if(b2)b2.disabled=!(S.pdraft.name.trim().length>1)||S.canWrite===false;}
 if(t.dataset.ein&&S.edraft){S.edraft[t.dataset.ein]=t.value;}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset&&t.dataset.photo&&t.files&&t.files[0]){var f=t.files[0],tg=S.photoT;photoCompress(f).then(function(d){var o=tg==='place'?S.pdraft:S.draft;if(o)o.photo=d;S.sheet=null;S._force=true;render(true);}).catch(function(){S.sheet=null;render(true);toast('تعذّر قراءة الصورة');});return;}
 if(t.dataset.ch==='place'&&S.draft){S.draft.placeId=t.value;S.draft.dishId='';S._force=true;render(true);}
 if(t.dataset.ch==='dish'&&S.draft){S.draft.dishId=t.value;S._force=true;render(true);}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(S.sheet||S.dlg||S.zoom)){S.sheet=null;S.dlg=null;S.zoom=null;render(true);}
 if(e.key==='Enter'&&e.target.id==='q'){var q=S.q.trim();if(q){var rec=LS.get('recent',[]).filter(function(x){return x!==q;});rec.unshift(q);LS.set('recent',rec.slice(0,6));e.target.blur();}}});

/* ---------- الإقلاع ---------- */
function snap(coll,key,flag,map){return S.db.collection(coll).onSnapshot(function(s){S[key]=map?map(s):s.docs.map(function(d){return Object.assign({id:d.id},d.data());});if(flag)S.loaded[flag]=true;render();},function(er){S.err=(er&&er.code)||'error';render(true);});}
function startData(){
 snap('places','places','p');snap('dishes','dishes','d');snap('reviews','reviews','r');
 S.db.collection('profiles').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data();});S.profiles=m;render();},function(){});
 if(S.uid)S.db.collection('data/users/'+S.uid).onSnapshot(function(s){S.saves=s.docs.map(function(d){return d.data();}).filter(function(x){return x&&x.type&&x.id;});render();},function(){});
 setTimeout(function(){if(!(S.loaded.p&&S.loaded.d&&S.loaded.r)){S.slow=true;render(true);}},10000);}
function boot(){
 render(true);
 var start=route().raw;S.started=!!start;
 var after=function(){S.booted=true;var r=route();if(!r.name){go(LS.get('onb_seen',0)?'home':'onb');}else render(true);};
 var T=setTimeout(function(){},0);
 var cl=window.claude;
 var pDb=cl&&cl.use?cl.use('db'):Promise.resolve(null),pUser=cl&&cl.use?cl.use('user'):Promise.resolve(null);
 Promise.all([pDb,pUser]).then(function(r){S.db=r[0];S.user=r[1];
  if(!S.user)return null;
  return Promise.all([S.user.id(),S.user.me(),S.user.can?S.user.can('data.write'):null]).then(function(v){S.uid=v[0];S.myName=(v[1]&&v[1].name)||'';S.canWrite=v[2];});
 }).catch(function(){}).then(function(){
  if(S.db)startData();
  if(PAGES&&LS.get('geo_ok',0))locate(true);
  setTimeout(function(){after();},route().raw?0:1400);
  if(!S.db)setTimeout(function(){S.booted=true;render(true);},route().raw?0:1400);
 });}
boot();
})();
